# ingress-nginx values — substrate 프로파일 "kind" 전용.
#
# kind 노드는 컨테이너라 LoadBalancer Service 를 외부에서 받을 방법이 없다. 대신
# controller 파드를 호스트 포트에 직접 바인딩(hostPort)해, terraform/cluster/kind 가 생성
# 시점에 뚫어둔 extraPortMappings(80/443 -> 호스트 8081/8444)로 트래픽을 받는다(spec D2).
controller:
  hostPort:
    enabled: true

  # hostPort 를 쓸 때는 Service 를 NodePort 로 둔다(ClusterIP 로는 클러스터 밖에서 못 닿고,
  # LoadBalancer 는 kind 에 컨트롤러가 없어 <pending> 으로 멈춘다).
  service:
    type: NodePort

  # terraform/cluster/kind 가 control-plane 노드에 이미 붙여둔 레이블이다
  # (kubectl get node -o jsonpath='{.items[0].metadata.labels}' 로 실측 확인:
  # "ingress-ready":"true"). 이 레이블이 있는 노드에만 컨트롤러를 스케줄한다 —
  # kind 싱글노드 구성에서도 "어디에 뜰지"를 명시해 둔다.
  nodeSelector:
    ingress-ready: "true"

  # control-plane 기본 taint(NoSchedule)를 넘어 컨트롤러를 그 노드에 스케줄하도록 허용한다.
  # kind 공식 ingress-nginx 배포 매니페스트(kind provider deploy.yaml)와 동일한 톨러레이션이다.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Equal
      effect: NoSchedule

  # IngressClass 를 명시하지 않은 Ingress 도 이 컨트롤러가 처리한다. 학습 환경에서
  # ingressClassName 누락으로 라우팅이 조용히 안 되는 혼란을 줄인다.
  watchIngressWithoutClass: true
