# root Application — gitops/apps/ 를 directory.recurse 로 읽는다. syncPolicy.automated 로
# 시작한다(brief 가 Step 0/root 는 automated 로 두고, 수동 sync 관찰은 Step 1(podinfo,
# Task 7)부터 하기로 했다).
#
# 🔴 아래 문자열 값은 quote 파이프 함수 대신 리터럴 큰따옴표로 감쌌다 — 파이프
# 함수만 쓰면 렌더링 전 원본 파일의 템플릿 표현식이 따옴표 없이 남아,
# pre-commit 의 check-yaml/yamllint 가 이중 중괄호를 중첩된 flow-mapping 으로
# 오해해 "found unhashable key"로 깨진다(실측). 리터럴 따옴표로 감싸면 원본도
# 유효한 YAML 문자열이고, 렌더링 후에도 올바르게 따옴표 쳐진 문자열이 된다.
#
# 🔴 최종 리뷰 정정 — `repoURL`은 `required`로 막는다. `values.yaml`의 기본값
# `repoUrl: ""`가 그대로면 이 필드가 빈 문자열인 Application이 조용히 렌더됐고,
# `helm lint`(`--strict` 포함)는 WARN만 내고 **통과했다**(실측) — 초록불인데
# 잘못된 chart였다. `helm template`(렌더 실행)만 실제로 실패시킨다(실측 아래).
# `required`는 자기 메시지용으로 큰따옴표를 또 써야 해서, 이 필드만 바깥을
# **홑따옴표**로 감쌌다 — Go template 문자열 리터럴은 큰따옴표만 허용해
# `\"` escape를 쓰면 Go template 파서가 그 백슬래시를 raw 텍스트 그대로 받아
# "unexpected \\ in operand"로 깨진다(실측). 홑따옴표로 감싸면 안쪽 큰따옴표가
# YAML·Go template 양쪽에 그대로 리터럴로 남아 충돌하지 않는다.
#
# 실측(2026-10-05, `helm template .`):
#   repoUrl 비움  → `Error: execution error at (...application.yaml:25:17): repoUrl 은 필수값이다 ...`
#   repoUrl 지정  → 정상 렌더, `repoURL: 'https://github.com/Melting-Face/argocd-study.git'`
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: "{{ .Values.namespace }}"
spec:
  project: default
  source:
    repoURL: '{{ required "repoUrl 은 필수값이다 - values.yaml 기본값이 빈 문자열이면 helm lint 는 통과하지만 Application 이 빈 repoURL 로 렌더된다" .Values.repoUrl }}'
    targetRevision: "{{ .Values.targetRevision }}"
    path: "{{ .Values.path }}"
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: "{{ .Values.namespace }}"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
