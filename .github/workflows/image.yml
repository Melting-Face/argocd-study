name: image

# 태그 push(vX.Y.Z) -> Airflow 커스텀 이미지 빌드·GHCR push(build) -> main 의 values 태그 한 줄 갱신(bump).
# 태그는 "빌드 이벤트"이고 배포 상태는 main 의 values 한 줄이다. ArgoCD 가 그 줄을 당겨 간다.
# GHCR 태그는 불변으로 취급한다 — 롤백은 이전 태그로 되돌리는 git revert 다.
#
# 🔴 bump 가 실패했을 때의 복구: Actions UI 에서 "Re-run failed jobs" 를 누른다.
#    build 는 이미 성공해 재실행되지 않으므로 불변 검사(이미 있는 태그 = 실패)에 걸리지 않는다.
#    "Re-run all jobs" 는 build 를 다시 돌려 불변 검사에서 실패하니 쓰지 않는다.
#
# 권한: 기본 GITHUB_TOKEN 만 쓴다(PAT·저장소 Secret 추가 없음). 잡별로 최소 권한을 준다.
# 🔴 main 에 branch protection 이 없어 bump 의 직접 push 가 가능하다(ci.yml 머리 주석 참고).
#    protection 을 켜면 이 push 가 막힌다.

on:
  push:
    tags:
      - 'v*.*.*'

# 같은 이미지에 대한 빌드·커밋이 겹치지 않게 직렬화한다(진행 중인 실행은 취소하지 않는다).
concurrency:
  group: image-airflow
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/melting-face/airflow-dags

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      # 트리거 글롭 v*.*.* 는 v1.2.3-rc1 같은 비형식 태그도 통과시킨다 — 빌드·push 전에 막는다.
      - name: 태그 형식 검사
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::태그 '$TAG' 가 vX.Y.Z 형식이 아니다"
              exit 1
          fi

      - name: 태그 ref 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # 태그 커밋이 main 의 조상이어야 한다 — main 에 없는 커밋(브랜치 작업물)이 배포되지 않게 한다.
      - name: 태그가 main 의 조상인지 검사
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::태그 커밋 $GITHUB_SHA 가 origin/main 의 조상이 아니다"
              exit 1
          fi

      - name: GHCR 로그인
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 불변 검사 — 같은 태그가 이미 레지스트리에 있으면 덮어쓰지 않고 실패한다.
      # 🔴 inspect 실패 사유를 구분하지 않는다(미존재든 일시 오류든 "없음"으로 읽어 빌드로 진행).
      - name: 이미지 태그 불변 검사
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
              echo "::error::$IMAGE:$TAG 가 이미 존재한다 — 태그는 불변이다"
              exit 1
          fi

      - name: 이미지 빌드·push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/airflow
          platforms: linux/arm64
          tags: ghcr.io/melting-face/airflow-dags:${{ github.ref_name }}
          push: true

  bump:
    needs: build
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: main 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: values 태그 갱신
        id: bump
        env:
          TAG: ${{ github.ref_name }}
        run: |
          result="$(scripts/bump-image-tag.sh "$TAG" gitops/charts/airflow/values.yaml)"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "bump 결과: $result"

      # 이미 같은 태그면 커밋할 것이 없다 — 이후 스텝을 건너뛰고 잡을 성공으로 끝낸다.
      - name: Helm 설치
        if: steps.bump.outputs.result == 'changed'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.0

      # 렌더가 깨지는 values 를 main 에 커밋하지 않도록 먼저 확인한다.
      - name: 렌더 확인
        if: steps.bump.outputs.result == 'changed'
        run: |
          scripts/helm-dep-build.sh gitops/charts/airflow
          helm template airflow gitops/charts/airflow -n airflow >/dev/null

      - name: 커밋·push
        if: steps.bump.outputs.result == 'changed'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add gitops/charts/airflow/values.yaml
          git commit -m "chore(airflow): 이미지 태그를 $TAG 로 갱신"
          if ! git push origin HEAD:main; then
              # 그 사이 main 이 앞서갔을 수 있다 — rebase 후 1회만 재시도한다.
              git pull --rebase origin main
              git push origin HEAD:main || exit 1
          fi
