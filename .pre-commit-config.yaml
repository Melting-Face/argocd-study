# 정적 품질 게이트 — pre-commit 훅 20개.
# 규칙의 단일 출처는 여기(그리고 각 훅 전용 설정 파일)이며,
# .github/workflows/ci.yml 은 이 설정을 그대로 재실행할 뿐 규칙을 중복 정의하지 않는다.
# 이후 모든 태스크의 커밋은 `pre-commit run --all-files` 를 통과해야 한다.
repos:
  # 범용 위생 훅 — 공백·병합 충돌 표식·대용량 파일·구문 오류를 잡는다.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
        # 🔴 Helm chart templates/ 는 Go 템플릿이지 순수 YAML이 아니다 — 실측
        # (2026-10-05): _helpers.tpl의 공통 레이블 블록을 나머지 템플릿에서
        # `{{- include "podinfo.labels" . | nindent 4 }}`처럼 한 줄 통째로 쓰면,
        # PyYAML이 `{{`를 중첩 flow-mapping 시작으로 읽어 닫는 `}}`를 찾을 때까지
        # 다음 줄들을 계속 끌어들이다 리스트 항목(`- name: ...`)의 `-`에서
        # "expected the node content, but found '-'"로 깨진다. `helm
        # lint --strict`·`helm template`(아래 helm-lint 훅·
        # gitops/charts/podinfo/tests/equivalence.sh)이 렌더링 후 YAML로서의
        # 정합성을 이미 검증하므로, 렌더 전 원문에 대한 이 검사는 제외한다.
        exclude: '^(terraform/platform/charts/appset|gitops/charts/podinfo)/templates/'
      - id: check-json
      # 저장소가 public 이므로 이 훅이 실제 방어선이다 — PEM/OpenSSH 키 "파일" 자체의 포맷을 본다.
      # gitleaks(아래)는 문자열 패턴을 보는 다른 축이라 역할이 겹치지 않는다.
      - id: detect-private-key

  # 시크릿 패턴 스캔 (규칙은 .gitleaks.toml) — 저장소가 public 이므로 실제 방어선이다.
  # 🔴 패턴 방어는 봉쇄가 아니다 — 새로운 포맷의 키는 놓칠 수 있다.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # 커밋 메시지 Conventional Commits 검사 (규칙은 루트 .gitlint)
  # 🔴 업스트림 정의가 `stages: [commit-msg]` 라 **`pre-commit run --all-files` 로는 실행되지
  #    않는다**(실측 — 목록에 이 훅 자체가 안 뜬다). 로컬에서 실제로 작동시키려면
  #    `pre-commit install --hook-type commit-msg` 를 **별도로** 돌려 `.git/hooks/commit-msg`
  #    를 깔아야 한다(`pre-commit install` 단독은 기본 pre-commit 스테이지만 깐다).
  #    그마저도 `git commit --no-verify` 로 우회 가능한 로컬 훅일 뿐이다 — CI 쪽 한계는
  #    .github/workflows/ci.yml 머리 주석을 본다.
  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint

  # YAML 린트 (규칙은 .yamllint.yaml)
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        # 🔴 check-yaml과 같은 이유로 제외한다 — 실측(2026-10-05): 위 check-yaml의
        # 치명적 구문 오류까지는 안 가더라도, `replicas: {{ .Values.x }}`처럼
        # 한 줄짜리 bare 표현식도 `{{`를 중첩 flow-mapping으로 읽어
        # "too many spaces inside braces"를 낸다(braces 규칙은 기본 error
        # 등급이라 훅이 실패한다). 정수형 필드(replicas·containerPort·
        # Service port)는 렌더 결과가 실제 정수여야 해 literal 따옴표로
        # 감싸는 우회(로컬 chart의 문자열 전용 트릭)를 쓸 수 없다 — 애초에
        # 렌더 전 원문을 YAML로 검사하는 것 자체가 범위 밖이라고 본다.
        exclude: '^(terraform/platform/charts/appset|gitops/charts/podinfo)/templates/'

  # 셸 스크립트 린트 — Task 1 시점엔 scripts/*.sh 가 없어 대상 0개로 스킵된다.
  # shellcheck-py 는 바이너리를 wheel 로 배포해 격리 venv 에 들어간다(로컬 설치 불필요).
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # 🔴 이 훅에만 거는 제외다(전역 exclude 아님) — `.agents/skills/**` 는 skills-lock.json 이
        #    `computedHash` 로 고정한 외부 소스(obra/superpowers) 그대로의 콘텐츠라 우리가
        #    작성한 코드가 아니고, 내용을 고치면 고정된 해시와 어긋난다.
        #    실측(2026-10-04): 이 제외 없이 `--all-files` 를 돌리면
        #    `.agents/skills/subagent-driven-development/scripts/sdd-workspace` 에서
        #    shellcheck SC1007 로 깨졌다 — shellcheck 는 "스타일을 고쳐라"는 보고라
        #    벤더 코드 스타일에 우리 게이트가 매여서는 안 된다.
        #    `.claude/skills/**` 는 `.agents/skills/**` 로의 심링크라 git 이 심링크 자체
        #    (경로 문자열)만 추적하므로 별도로 적지 않아도 된다(실측: 심링크 쪽에서는
        #    아무 훅도 걸리지 않았다).
        # ⚠️ gitleaks·detect-private-key 는 **여기서 제외하지 않는다** — 그 둘은 "파일을 고쳐라"가
        #    아니라 "시크릿이 있는지 보고한다"이고, 저장소가 public 이라 실제 방어선(spec R9)이다.
        #    탐지기는 벤더 콘텐츠를 고치지 않으므로 skills-lock.json 의 고정 해시와 충돌하지
        #    않는다 — 벤더 디렉터리를 영구 사각지대로 남길 이유가 없다.
        exclude: '^\.agents/skills/'

  # GitHub Actions 워크플로 정적 검사 — 표현식·runs-on·액션 입력 오타를 push 전에 잡는다.
  # 정확한 릴리스 태그로 고정한다(latest 금지). 내장된 shellcheck 연동은 PATH 에 없으면 건너뛴다.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Terraform 포매터 + tflint(규칙은 .tflint.hcl).
  # 훅 id 는 "terraform_tflint" 이지만 감싸는 도구는 brief 가 말하는 tflint 그 자체다.
  # files 패턴이 `*.tf`/`*.tfvars` 로 한정돼 있어 Task 1 시점(.tf 파일 0개)에는
  # 대상이 없어 자동으로 스킵된다 — 여기엔 별도 가드가 필요 없다.
  #
  # 🔴 terraform_validate 는 여기 넣지 않는다 — `validate`는 `init` 이 선행돼야 하는데
  #    `.terraform/`은 .gitignore 대상이라 로컬에 없다. 훅에서 init 을 돌리면 커밋이
  #    프로바이더 레지스트리 가용성에 묶인다. validate 는 CI 잡(.github/workflows/ci.yml)이
  #    각 스택에서 `-backend=false` 로 init 한 뒤에 진다(Ruling R-A).
  #
  # 🔴 Ruling R-B (2026-10-04, Task 4 fix round 1 보충 판정) — `terraform_tflint`
  #    훅은 tflint 바이너리가 **시스템 PATH에 있어야** 돈다. Task 1~3은 `.tf` 파일이
  #    0개라 `files` 글롭이 늘 비어 이 훅이 매번 Skipped 였고, 그래서 "tflint 설치
  #    안 돼 있음"이 한 번도 드러나지 않았다 — **"대상 0개라 Skipped"를 "통과"로
  #    읽으면 안 된다는 실례**(wiki/terraform-on-kind.md 참고). Task 4가 `.tf`를
  #    처음 추가하며 로컬·CI 양쪽에서 `ERROR: 'tflint' is required ... but it is
  #    not discoverable in the system's PATH`로 실제로 실패했다.
  #    `--hook-config=--tool-version=`을 주면 `pre-commit-terraform`이 그 버전을
  #    **직접 내려받아 캐시**한다(시스템 설치 불필요) — `.github/workflows/ci.yml`에
  #    설치 스텝을 추가하는 대안도 있었으나, 그쪽은 CI 러너만 고치고 **클론 직후
  #    로컬 `pre-commit run --all-files`는 여전히 깨진 채로 둔다. 이 방식은 로컬·CI
  #    둘 다 같은 경로(pre-commit 캐시)로 고친다 — latest 금지 원칙에 따라 버전을
  #    정확히 고정한다(0.64.0, 2026-10-04 기준 최신 안정판).
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.0
    hooks:
      - id: terraform_fmt
      - id: terraform_tflint
        args:
          - --hook-config=--tool-version=0.64.0

  # Helm chart 린트 게이트(Task 1, Phase 2) — spec §7-4가 신규 pre-commit 훅으로
  # 계획했으나 Phase 1(Task 6이 첫 로컬 chart인 terraform/platform/charts/root-app
  # 을 추가한 뒤까지)에는 도입되지 않은 채였다(AGENTS.md "강제 수단과 그 한계" 표의
  # 기존 기록). 로컬에서 작성한 chart가 여럿이라(아래 loop 목록 — root-app 은
  # Phase 3 Task 6 에서 appset 으로 대체돼 빠졌다) 모두 깐다. 커뮤니티 pre-commit 훅 저장소에 기대지 않고
  # `language: system` 로컬 훅으로 직접 호출한다 — 이미 설치된 helm 바이너리를
  # 그대로 쓴다(다른 훅처럼 버전을 pre-commit이 받아 캐시하지 않으므로, 로컬·CI의
  # helm 버전이 서로 다르면 린트 결과가 달라질 수 있다는 한계가 있다).
  #
  # 🔴 한계(실측, 2026-10-05) — `helm lint --strict`는 템플릿의 `required` 가드
  # 미충족을 ERROR가 아니라 WARN으로만 낸다:
  #   `level=WARN msg="missing required values" message="..."` , 그래도
  #   "1 chart(s) linted, 0 chart(s) failed"로 **exit 0 통과**한다.
  # 반면 `helm template`(렌더 실행)은 같은 상황에서 실제로 실패한다(exit 1,
  # `Error: execution error at (...): ... 는 필수값이다`). 즉 이 훅은 Chart.yaml
  # 구조 오류(필수 필드 누락 등 — 실측: `version:` 삭제 시 `[ERROR] Chart.yaml:
  # version is required`로 exit 1)는 잡지만 **값 수준 required 위반은 놓친다** —
  # "helm lint가 통과했다"를 "chart가 올바르다"로 읽지 않는다(이 저장소 규율).
  # 값 수준 검증은 gitops/charts/podinfo/tests/equivalence.sh(내부에서 helm
  # template을 호출한다)와 Task 2의 실제 배포 관측이 메운다.
  #
  # gitops/charts/airflow 는 공식 chart 를 dependency 로 감싼 umbrella 라서 lint 전에
  # `helm dependency build` 가 필요하다(없으면 "missing in charts/ directory" 로 깨진다).
  # 산출물 charts/*.tgz 는 .gitignore 대상이고 Chart.lock 이 버전을 고정한다. 이 훅은
  # 의존 chart 를 https://airflow.apache.org 에서 내려받으므로 네트워크가 필요하다(CI 포함).
  # 따라서 이 훅은 레지스트리 가용성에 묶인다 — terraform_validate 를 훅에서 뺀 이유와 같은
  # 한계지만, 여기서는 lint 가 의존 chart 없이는 성립하지 않아 감수한다.
  - repo: local
    hooks:
      - id: helm-lint
        name: Helm chart 린트 (helm lint --strict)
        language: system
        entry: >-
          bash -c 'set -e;
          for d in terraform/platform/charts/appset gitops/charts/podinfo gitops/charts/airflow; do
          scripts/helm-dep-build.sh "$d";
          echo "--- helm lint --strict $d ---"; helm lint --strict "$d"; done'
        pass_filenames: false
        files: '^(terraform/platform/charts/appset|gitops/charts/podinfo|gitops/charts/airflow)/'

  # Python 린트 + 포맷 (규칙은 pyproject.toml [tool.ruff], Task 2 에서 scripts/*.py 와 함께 추가)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
      - id: ruff-format

  # 문서 시제 어휘 검사(scripts/doc_lint.py 기본 검사) — dagster-study 이식·변형판.
  # 원본에서 링크 검사·시제 검사만 남기고 데이터·분석 전용 축은 제거했다
  # (scripts/doc_lint.py 머리 주석 참고).
  # 🔴 **검사기 자신을 모집단에 넣는다** — `\.md$`만 두면 doc_lint.py만 고치는
  #    커밋에서 이 훅이 통째로 Skipped 가 된다(하필 게이트를 바꾸는 커밋에서
  #    게이트가 안 도는 형태를 막는다).
  - repo: local
    hooks:
      - id: doc-lint
        name: 문서 시제 어휘 검사
        language: system
        entry: python3 scripts/doc_lint.py
        pass_filenames: false
        files: '(\.md$|^scripts/doc_lint\.py$)'
        stages: [pre-commit]

      # 저장소 전역 링크·앵커 + 위키 인덱스(Home.md·_Sidebar.md) 등재 검사.
      # 🔴 판정이 파일 단위가 아니라 "A 가 B 를 가리키는가" 관계 단위라 pass_filenames
      #    가 의미가 없고, 모집단이 항상 전체여야 해 always_run 으로 둔다
      #    (scripts/doc_lint.py 의 check_links·check_wiki_index 머리 주석 참고).
      - id: doc-links
        name: 문서 링크·앵커·위키 인덱스 검사
        language: system
        entry: python3 scripts/doc_lint.py --links
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
