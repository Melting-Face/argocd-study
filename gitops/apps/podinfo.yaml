# podinfo Application — Step 1 교재(spec D8). root Application(terraform/platform
# charts/root-app)이 gitops/apps/ 를 directory.recurse 로 지켜보다 이 파일이
# 커밋·push되는 순간 집어간다 — kubectl을 한 번도 쓰지 않고 앱이 생긴다(spec 성공 기준 2).
#
# 🔑 repoURL은 root Application과 평문으로 중복된다(설계 스펙 D4) — ArgoCD에는
# repoURL 전역 변수가 없고, 이 파일은 Git에 커밋되는 정적 YAML이라 각자 들고 있어야
# 한다. 불일치는 .github/workflows/ci.yml의 repoURL 일관성 검사 스텝이 잡는다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Melting-Face/argocd-study.git
    targetRevision: main
    path: gitops/manifests/podinfo
  destination:
    server: https://kubernetes.default.svc
    # 🔴 네임스페이스는 Terraform이 아니라 ArgoCD가 만든다(CreateNamespace=true) —
    # §3-1 소유권 경계: Terraform은 클러스터 "안"의 어떤 것도 소유하지 않는다.
    namespace: podinfo
  syncPolicy:
    # 🧪 Task 8 실험 4 (재관측) — prune: true 로 전환. 고아로 남아 있던 ingress 가
    # 지워지는지 관측한다(wiki/drift-and-selfheal.md).
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
