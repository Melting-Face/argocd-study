airflow:
  # Airflow 공식 Helm chart(apache-airflow/airflow) values 오버라이드
  #
  # 이 파일은 umbrella chart(gitops/charts/airflow)의 values 다. 공식 chart 는
  # dependency 라서 모든 키가 최상위 `airflow:` 아래로 들어간다(들여쓰기 한 단계).
  # ArgoCD 가 gitops/charts/airflow 를 소스로 읽어 배포한다.
  #
  # 차트 사실(실측, 2026-10-06):
  #   helm show values apache-airflow/airflow --version 1.22.0
  #   - 차트 1.22.0 / appVersion(=defaultAirflowTag/airflowVersion) 3.2.2 → Airflow 3
  #   - 기본 executor: "CeleryExecutor" (spec은 LocalExecutor 요구)
  #   - UI는 apiServer가 서빙. webserver 블록은 airflowVersion<3.0.0 에서만 리소스가
  #     렌더되는 레거시 블록(templates/webserver/*.yaml 전부 `semverCompare "<3.0.0"` 게이트).
  #   - ingress.apiServer가 Airflow3 UI의 Ingress. ingress.web은 역시 <3.0.0 게이트.
  #   - 기본 enabled: redis=true, statsd=true, triggerer=true, postgresql=true,
  #     flower=false, pgbouncer=false (LocalExecutor인데 redis/statsd가 켜져 있다)
  #
  # 🔴 Secret 이름은 values 에 고정하고 값은 Git 에 넣지 않는다 — 아래 section 0·11 참고.

  # --- 0. 이미지와 정적 Secret 참조 ---
  # 커스텀 이미지(base apache/airflow:3.2.2 + DAG 내장). 태그 한 줄이 배포 상태의 단일
  # 출처다 — GitHub Actions 가 scripts/bump-image-tag.sh 로 마커 줄(`# bump-image-tag`)만
  # 고친다. 🔴 마커 주석은 이 파일에서 이 줄에만 둔다(스크립트가 정확히 1줄을 요구한다).
  images:
    airflow:
      repository: ghcr.io/melting-face/airflow-dags
      tag: "v0.1.0"  # bump-image-tag

  # 공식 chart 는 fernet key·JWT secret 을 지정하지 않으면 렌더(=sync)마다 randAlphaNum
  # 으로 새로 만든다 → 렌더가 비결정적이라 ArgoCD 가 계속 OutOfSync 가 되고 재시작 때
  # 암호화된 Connection 을 복호화하지 못한다. 이름을 지정해 chart 가 Secret 을 만들지 않고
  # 미리 만들어 둔 Secret 을 참조하게 한다(Secret 은 수동 생성 — 값은 Git 에 없다).
  fernetKeySecretName: "airflow-fernet-key"  # 데이터 키 fernet-key
  jwtSecretName: "airflow-jwt-secret"  # 데이터 키 jwt-secret

  # --- 1. Executor ---
  # spec(설계 문서)이 LocalExecutor를 요구한다. Celery 전용 리소스(redis·worker)를
  # 걷어내는 전제가 된다.
  executor: "LocalExecutor"

  # --- 2. LocalExecutor에서 불필요한 컴포넌트를 끈다 ---
  # redis: CeleryExecutor/CeleryKubernetesExecutor의 브로커다. LocalExecutor는 태스크를
  # scheduler 프로세스 안에서 직접 포크하므로 브로커가 필요 없다. 기본값 true를 그대로
  # 두면 StatefulSet+PVC 하나가 아무 일도 안 하며 뜬다 — 끈다.
  redis:
    enabled: false

  # statsd: 메트릭 익스포터. 이 학습 환경에는 메트릭 수집 파이프라인(Prometheus 등)이
  # 없어 statsd exporter가 받아도 아무도 긁어가지 않는다 — 끈다. (필요해지면 Task 7
  # 이후 관측 축에서 다시 켠다.)
  statsd:
    enabled: false

  # --- 3. triggerer 판단: 켜 둔다 ---
  # 🔑 판단: triggerer는 끄지 않는다(기본값 true 유지, 아래 resources만 명시).
  # 이유:
  #   - triggerer는 Airflow 2.2+/3.x의 deferrable operator(센서를 폴링 없이 비동기
  #     이벤트 루프로 대기)를 실행하는 전용 프로세스다. 끄면 deferrable 태스크를 쓰는
  #     DAG가 즉시 실패하거나(디퍼 불가) 영원히 스케줄되지 않는다.
  #   - Task 4가 example DAG로 success를 "관측"해야 하는데, 어떤 example DAG가
  #     deferrable sensor를 쓰는지 이 Task 시점에는 확정하지 않았다 — triggerer를
  #     꺼서 그 가능성을 미리 차단하는 것보다, 파드 하나(및 PVC 하나, 아래 참고) 늘어나는
  #     비용을 감수하고 켜 두는 쪽이 "Task 4가 막히지 않는다"는 안전 쪽이다.
  #   - 대가: triggerer.persistence.enabled(차트 기본 true)라 StatefulSet + PVC가
  #     하나 더 생긴다(triggerer 로그를 파드 재시작 후에도 API로 서빙하기 위함). Step 4
  #     자원 합계에 포함했다.
  triggerer:
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "250m"
        memory: "512Mi"
    # 차트 기본 persistence.size(100Gi)는 local-path-provisioner가 용량을 강제하지
    # 않는 학습 클러스터에선 사실상 숫자일 뿐이지만, PVC가 substrate 계약 ③의
    # `standard` StorageClass를 쓰도록 명시한다(기본 StorageClass가 바뀌어도
    # 깨지지 않게 하려면 비워 두는 게 맞지만, 이 값 파일은 "이 substrate에서 이
    # StorageClass를 쓴다"를 눈에 보이게 적는 쪽을 택했다).
    persistence:
      storageClassName: "standard"
    logGroomerSidecar:
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"

  # --- 4. webserver(레거시) 블록 — 함정 기록용으로 명시적으로 끈다 ---
  # 🔑 실측: airflowVersion>=3.0.0에서는 templates/webserver/*.yaml 전부가
  # `semverCompare "<3.0.0" .Values.airflowVersion`로 게이트돼 있어 webserver.enabled
  # 값과 무관하게 아무 리소스도 렌더되지 않는다(이미 비활성 — 이 설정은 기능적으로는
  # no-op). 그래도 "webserver는 레거시, UI는 apiServer가 서빙한다"는 판단을 값으로
  # 남겨 다음에 airflowVersion을 2.x로 내리는 실수를 하더라도 webserver가 조용히
  # 살아나지 않게 한다.
  webserver:
    enabled: false

  # --- 5. apiServer (Airflow 3 UI/REST API) ---
  apiServer:
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"

  # --- 6. scheduler ---
  scheduler:
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"
    logGroomerSidecar:
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"

  # --- 6-1. LocalExecutor에서 scheduler가 쓰는 PVC ---
  # 🔑 실측(helm template): executor에 "Local"이 포함되면 scheduler-deployment.yaml이
  # scheduler를 **StatefulSet**으로 렌더하고(`$local` and `$persistence`, 둘 다 기본 true),
  # `workers.persistence`(deprecated 최상위 키, workers.celery.persistence가 비어 있으면
  # 이걸로 fallback — 템플릿 370행 실측) 설정으로 "logs"라는 이름의 volumeClaimTemplate을
  # 만든다. $local 모드에서는 scheduler가 worker 역할도 겸해서 태스크 로그를 직접
  # 들고 있어야 하기 때문이다. storageClassName을 비워 두면 클러스터 기본 SC로 가지만,
  # 이 값 파일은 명시적으로 `standard`를 적어 substrate 계약 ③을 눈에 보이게 한다.
  workers:
    persistence:
      storageClassName: "standard"

  # --- 7. dagProcessor ---
  # Airflow 3는 scheduler가 더 이상 DAG 파일을 직접 파싱하지 않는다
  # (config.scheduler.standalone_dag_processor가 airflowVersion>=3.0.0일 때 자동으로
  # 'True' — 차트 values.yaml 주석 실측). dagProcessor.enabled 기본값(~)도 같은 조건으로
  # true로 해석된다. 즉 이 컴포넌트는 Airflow 3에서 **끌 수 있는 선택이 아니라 필수**다.
  dagProcessor:
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"
    logGroomerSidecar:
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"

  # --- 8. 일회성 Job (DB 마이그레이션 / 초기 admin 계정) ---
  # 🔴 ArgoCD 교착 회피 — 근거: Airflow Helm chart 1.22.0 문서 "Installing the Helm Chart
  # with Argo CD, Flux, Rancher or Terraform", Argo CD 문서 "Helm Hooks".
  # chart 의 두 Job 은 기본으로 helm.sh/hook: post-install,post-upgrade 를 달고, ArgoCD 는
  # 이를 PostSync 로 옮긴다. PostSync 는 리소스가 Healthy 가 된 뒤에야 도는데 파드(api-server·
  # dag-processor·scheduler·triggerer)는 마이그레이션을 기다려 Init:Error 로 반복한다(2026-10-08
  # 관측: wait-for-airflow-migrations 의 "TimeoutError: There are still unapplied migrations
  # ... MigrationHead(s) in DB: set()", 네임스페이스에 Job 없음) → 교착.
  # 그래서 Helm 훅을 끄고(useHelmHooks: false) migrate Job 은 ArgoCD Sync 훅으로 돌린다.
  # 트레이드오프(문서가 인정): sync 마다 마이그레이션이 다시 돈다 — 이상적이진 않지만 자동이다.
  migrateDatabaseJob:
    useHelmHooks: false
    jobAnnotations:
      "argocd.argoproj.io/hook": Sync
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "250m"
        memory: "512Mi"

  createUserJob:
    useHelmHooks: false
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"

  # --- 9. postgresql (차트 내장 subchart, bitnami/postgresql 13.2.24) ---
  # 학습 환경에는 차트 내장 Postgres로 충분하다(spec이 외부 RDS 등을 요구하지 않음).
  # PVC는 substrate 계약 ③의 기본 StorageClass(`standard`)를 명시적으로 쓴다.
  postgresql:
    enabled: true
    primary:
      resources:
        requests:
          cpu: "250m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
      persistence:
        storageClass: "standard"

  # --- 10. Ingress — apiServer만 연다 (ingress.web은 <3.0.0 게이트라 애초에 안 먹는다) ---
  ingress:
    apiServer:
      enabled: true
      host: "airflow.localtest.me"
      ingressClassName: "nginx"

  # --- 11. API(Flask) secret key — Git에 값을 넣지 않는다 ---
  # Secret 은 수동으로 만든다(이름 `airflow-webserver-secret`, 데이터 키 `api-secret-key`).
  # Airflow 3 / chart 1.22.0 에서 AIRFLOW__API__SECRET_KEY 를 채우는 것은
  # apiSecretKeySecretName 이다.
  #
  # `webserverSecretKeySecretName` 은 삭제했다: Airflow 2 전용이다(chart 의
  # templates/_helpers.yaml 이 `semverCompare "<3.0.0" .Values.airflowVersion` 으로 게이트해
  # airflowVersion 3.2.2 에서는 주입에 전혀 쓰이지 않는 죽은 값이다).
  apiSecretKeySecretName: "airflow-webserver-secret"
