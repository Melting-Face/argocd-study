# gitops/manifests/podinfo/service.yaml(Phase 1 정답지)를 그대로 재작성한 것.
# selector는 podinfo.selectorLabels(= app.kubernetes.io/name: podinfo) 하나뿐이다 —
# Deployment의 pod 템플릿 레이블과 정확히 일치해야 트래픽이 붙는다.
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  labels:
    {{- include "podinfo.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "podinfo.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ required "values.yaml의 service.port 는 필수값이다" .Values.service.port }}
      targetPort: http
      protocol: TCP
