# gitleaks 설정 (시크릿 스캐너).
# 저장소가 public 이므로 push 가 곧 공개다 — 이 훅이 실제 방어선이다.
# pre-commit `gitleaks` 훅이 이 설정을 자동 탐지한다.
title = "argocd-study gitleaks config"

# 기본 규칙셋을 그대로 사용한다(brief 지정 — 커스텀 룰 추가는 이 태스크 범위 밖).
[extend]
useDefault = true

[allowlist]
description = "예시(.example) 파일만 경로로 제외한다 — 경로를 통째로 빼면 실제 키를 놓칠 수 있다"

# 🔴 "값이 비어 있는 예시 파일만"이라는 근거는 실제와 다르다(최종 리뷰 정정) —
# terraform/platform/local.auto.tfvars.example 은 비어 있지 않고 실제 경로·URL을
# 담고 있다. 이 경로 제외는 .tfvars.example/.env.example 패턴에 맞는 파일 전체를
# 빼므로, 앞으로 그 파일들에 들어가는 비밀값은 스캔되지 않는다 — AGENTS.md
# "강제 수단과 그 한계" 표 gitleaks 행 참고. (.gitignore 의 `*.tfvars` /
# `!*.tfvars.example` 과 짝)
paths = [
    '''\.tfvars\.example$''',
    '''\.env\.example$''',
]
